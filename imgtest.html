<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kiem tra anh VietFit JS</title>
</head>
<body>
<h1>Kiem tra anh 5965 bang JS</h1>
<p>1. Anh khai bao thuong (jsDelivr):</p>
<img src="https://cdn.jsdelivr.net/gh/dakhoaquangnam/VietFit@a196d106fd7c5942cb21c76008566fa165a12810/catalogue/media/still/5965.webp" alt="jsdelivr">
<p>2. Anh khai bao thuong (raw):</p>
<img src="https://raw.githubusercontent.com/dakhoaquangnam/VietFit/a196d106fd7c5942cb21c76008566fa165a12810/catalogue/media/still/5965.webp" alt="raw">
<div id="results" style="margin-top:20px;font-size:20px"></div>
<script>
var out = document.getElementById('results');
function log(s) { var p = document.createElement('p'); p.textContent = s; out.appendChild(p); }
var jsd = new Image();
jsd.loading = 'lazy';
jsd.decoding = 'async';
jsd.draggable = false;
jsd.onload = function () { log('JS img jsDelivr: LOADED'); };
jsd.onerror = function () { log('JS img jsDelivr: ERROR'); };
jsd.src = 'https://cdn.jsdelivr.net/gh/dakhoaquangnam/VietFit@a196d106fd7c5942cb21c76008566fa165a12810/catalogue/media/still/5965.webp';
document.body.appendChild(jsd);
var raw = new Image();
raw.loading = 'lazy';
raw.decoding = 'async';
raw.draggable = false;
raw.onload = function () { log('JS img raw: LOADED'); };
raw.onerror = function () { log('JS img raw: ERROR'); };
raw.src = 'https://raw.githubusercontent.com/dakhoaquangnam/VietFit/a196d106fd7c5942cb21c76008566fa165a12810/catalogue/media/still/5965.webp';
document.body.appendChild(raw);
var v = document.createElement('video');
v.autoplay = true; v.muted = true; v.loop = true; v.playsInline = true;
v.addEventListener('loadeddata', function () { log('JS video jsDelivr clip: LOADED'); });
v.addEventListener('error', function () { log('JS video jsDelivr clip: ERROR'); });
v.src = 'https://cdn.jsdelivr.net/gh/dakhoaquangnam/VietFit@a196d106fd7c5942cb21c76008566fa165a12810/catalogue/media/clip/5965.mp4';
document.body.appendChild(v);
</script>
</body>
</html>
