<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512">
  <!-- App-icon source for VietFit: the barbell glyph on the app's sky accent
       (#007aff, the blue behind accent 'sky'), geometry kept 1:1 from the
       previous icon so the native app, the home-screen PWA and the website
       favicon all show the same icon once their PNGs are regenerated from
       this file with the assets generator (icon background #007aff, splash
       background #ffffff) and public/icon-512.png / icon-180.png are exported
       from it for the PWA.
       The PNGs already in the repo are still the old dark/lime icon until
       that command runs — regenerate before any store build. -->
  <rect width="512" height="512" fill="#007aff"/>
  <g fill="#ffffff">
    <rect x="80" y="242" width="352" height="28"/>
    <rect x="80" y="199" width="36" height="114"/>
    <rect x="131" y="169" width="47" height="174"/>
    <rect x="334" y="169" width="47" height="174"/>
    <rect x="396" y="199" width="36" height="114"/>
  </g>
</svg>
